# Its own workspace: excluded from the root one because Tauri cannot build on the Linux
# side of this repo. See the root Cargo.toml.
[workspace]

[package]
name = "es9-app"
version = "0.1.0"
edition = "2024"
description = "Desktop shell: the ES-9 mixer over real MIDI, with metering"
repository = "https://github.com/wday/es9-mixer"
# Links es9-audio, which links the ASIO SDK under its GPLv3 option.
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
es9-protocol = { path = "../es9-protocol" }
es9-device = { path = "../es9-device", features = ["serde"] }
es9-midi = { path = "../es9-midi" }
es9-audio = { path = "../es9-audio" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
missing_docs = "warn"
